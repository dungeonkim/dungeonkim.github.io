<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <a class="skip-link" href="#games">게임 목록으로 건너뛰기</a>
  <div class="page">
    <header>
      <a class="brand" href="/" aria-label="dungeonkim 홈">dk<span>↗</span></a>
      <span class="eyebrow">A PERSONAL GAME ARCHIVE</span>
      <a class="text-link" href="https://github.com/dungeonkim">GitHub <span aria-hidden="true">↗</span></a>
    </header>
    <main>
      <section class="intro" aria-labelledby="site-title">
        <p class="eyebrow"><span class="dot" aria-hidden="true"></span> 오래된 게임, 새로운 플레이</p>
        <h1 id="site-title">{{title}}</h1>
        <p class="introduction">{{description}}</p>
      </section>
      <section id="games" aria-labelledby="games-heading">
        <div class="section-heading">
          <h2 id="games-heading">공개한 게임 <span>{{count}}</span></h2>
          <span class="eyebrow">SELECTED WORKS</span>
        </div>
        {{games}}
      </section>
    </main>
    <footer><span>만든 사람 · 김동건</span><span class="eyebrow">OLD GAMES. STILL PLAYING.</span></footer>
  </div>
</body>
</html>
