  <!-- EngineCore looks for div[flatfast="palo2"] -->
  <div id="app" flatfast="palo2"></div>

  <!-- PWA In-App Install Prompt Button (Hidden by default; enabled via Application config) -->
  <div id="ff-pwa-install-container" role="button" aria-label="앱 설치" data-enabled="false">
    <svg viewBox="0 0 24 24">
      <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
    </svg>
    <span>앱 설치</span>
    <span id="ff-pwa-dismiss-btn" title="닫기">&times;</span>
  </div>

  <script>
    // PWA Service Worker & Install Prompt Wiring
    (function () {
      const isHttp = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      const isStandalone = window.matchMedia('(display-mode: fullscreen)').matches ||
                           window.matchMedia('(display-mode: standalone)').matches ||
                           navigator.standalone === true;

      // Register Service Worker if on supported web protocol
      if ('serviceWorker' in navigator && isHttp) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
        });
      }

      // Handle beforeinstallprompt for in-app install button
      // Default: disabled (showPWAInstallButtonOverlay: false). Only shown if enabled via Application config.
      window.__pwaDeferredPrompt = null;
      const installContainer = document.getElementById('ff-pwa-install-container');
      const dismissBtn = document.getElementById('ff-pwa-dismiss-btn');

      if (!isStandalone && installContainer) {
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          window.__pwaDeferredPrompt = e;
          if (installContainer.dataset.enabled === 'true') {
            installContainer.style.display = 'inline-flex';
          }
        });

        installContainer.addEventListener('click', async (e) => {
          if (e.target === dismissBtn) return;
          if (!window.__pwaDeferredPrompt) return;
          installContainer.style.display = 'none';
          window.__pwaDeferredPrompt.prompt();
          await window.__pwaDeferredPrompt.userChoice;
          window.__pwaDeferredPrompt = null;
        });

        if (dismissBtn) {
          dismissBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            installContainer.style.display = 'none';
          });
        }

        window.addEventListener('appinstalled', () => {
          installContainer.style.display = 'none';
          window.__pwaDeferredPrompt = null;
        });
      }
    })();
  </script>

  <!-- [restore] worker architecture: engineEntry spawns the game-logic worker (gameLoader)
       and constructs EngineCore (main thread renderer). Was the single-thread boot.js loopback. -->
